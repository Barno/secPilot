name: DevSecOps Pipeline (Trivy Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Scansione Vulnerabilità
    runs-on: ubuntu-latest

    steps:
      # Step 1: Scarica il codice dal repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Step 2: Lancia Trivy (Scanner di Sicurezza Open Source)
      - name: Analisi Vulnerabilità e Segreti
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs' # Scansiona il file system (codice sorgente e Dockerfile)
          format: 'sarif' # Output SARIF per il tab Security di GitHub
          output: 'trivy-results.sarif'
          exit-code: '1'  # Se trova problemi critici, fa fallire (rompe) la pipeline
          severity: 'CRITICAL,HIGH' # Cerca solo vulnerabilità Alte o Critiche
          ignore-unfixed: true # Non bloccare la pipeline su CVE senza patch disponibile
          scanners: 'vuln,secret,misconfig'  # Scansiona sia vulnerabilità che segreti

      # Step 3: Carica i risultati nel tab Security di GitHub
      - name: Upload risultati SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
